name: Web (wasm demo + GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: wasm-bindgen CLI
        run: |
          VERSION=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' \
            | head -n1)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Сборка полной веб-версии для проверок
        # Полную версию проверяем браузером до замены её публичным демо.
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p burmalda57-web
          wasm-bindgen target/wasm32-unknown-unknown/release/burmalda57.wasm \
            --out-dir apps/web/web/pkg --target web --remove-name-section

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/tests/package-lock.json

      - name: Проверки сессий и ключей в Chromium
        working-directory: apps/web/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Снимки браузерных проверок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-regressions
          path: apps/web/tests/artifacts
          if-no-files-found: ignore

      - name: Сборка демо и генерация JS-обвязки
        run: |
          # Pages — только демо: API дневника не работает с публичного хостинга.
          cargo build --locked --release --target wasm32-unknown-unknown -p burmalda57-web --features demo-only
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/burmalda57.wasm \
            --out-dir apps/web/web/pkg \
            --target web --remove-name-section

      - name: Артефакт для GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/web

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
