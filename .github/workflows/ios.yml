name: iOS (smoke test + unsigned IPA)

# Два параллельных job'а:
#   smoke — собирает под симулятор, запускает приложение, делает скриншот и собирает логи;
#   ipa   — собирает неподписанный .ipa для устройства (AltStore / Sideloadly / TrollStore).
# На main после успешных smoke+ipa обновляется единственный релиз ios-latest
# с самой свежей неподписанной сборкой.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────── Smoke-тест в симуляторе ─────────────────────────
  smoke:
    name: Smoke test (simulator)
    runs-on: macos-15 # Apple Silicon, значит таргет aarch64-apple-ios-sim
    timeout-minutes: 60
    env:
      BUNDLE_ID: ru.burmalda.journal
      # DSN вшивается в бинарник при компиляции; без секрета Sentry выключен
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Подготовка окружения
        run: |
          # cmake нужен aws-lc-sys (TLS), ninja — запасной путь Skia
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          xcodebuild -version
          rustc --version

      - name: Сборка под симулятор
        run: >
          cargo build --release
          --target aarch64-apple-ios-sim
          -p burmalda57-ios
          --bin burmalda57-ios
          --features ios-app

      - name: Упаковка .app для симулятора
        run: |
          APP=build/burmalda57.app
          rm -rf build && mkdir -p "$APP"
          cp target/aarch64-apple-ios-sim/release/burmalda57-ios "$APP/burmalda57"
          chmod +x "$APP/burmalda57"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/ios/rust/Cargo.toml | head -n1)
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@BUILD@/${{ github.run_number }}/" apps/ios/rust/ios/Info.plist > "$APP/Info.plist"
          # для симулятора платформа в Info.plist другая
          /usr/libexec/PlistBuddy -c "Set :CFBundleSupportedPlatforms:0 iPhoneSimulator" "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          cp apps/ios/rust/ios/icons/*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"
          # симулятору нужна хотя бы ad-hoc подпись
          codesign --force --sign - "$APP"

      - name: Запуск в симуляторе
        id: run
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Симулятор: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/burmalda57.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID" | tee launch.txt

          # даём приложению 20 секунд: если оно упадёт при старте, это будет видно
          sleep 20
          xcrun simctl io "$UDID" screenshot screenshot.png

          # у живого процесса в launchctl есть PID, у упавшего стоит "-"
          xcrun simctl spawn "$UDID" launchctl list | grep "$BUNDLE_ID" | tee state.txt
          PID=$(awk '{print $1}' state.txt | head -1)
          if [ -z "$PID" ] || [ "$PID" = "-" ]; then
            echo "::error::Приложение не запущено или упало после старта"
            exit 1
          fi
          echo "OK: приложение работает, PID $PID"

      - name: Собрать логи и краш-репорты
        if: always()
        run: |
          mkdir -p artifacts
          cp screenshot.png launch.txt state.txt artifacts/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*burmalda* artifacts/ 2>/dev/null || true
          xcrun simctl spawn booted log show --last 2m --style compact \
            --predicate 'process == "burmalda57"' > artifacts/app.log 2>&1 || true

      - name: Проверить, что UI реально создался
        run: |
          if grep -q "could not load class" artifacts/app.log; then
            echo "::error::Не загрузился класс сцены, UI не создан (чёрный экран)"
            exit 1
          fi

      - name: Артефакты smoke-теста (скриншот, логи)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: artifacts/
          if-no-files-found: warn

  # ───────────────────────── Неподписанный .ipa ─────────────────────────
  ipa:
    name: Unsigned IPA (device)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Подготовка окружения
        run: |
          # cmake нужен aws-lc-sys (TLS), ninja — запасной путь Skia, если нет готовых бинарников
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          xcodebuild -version
          rustc --version

      - name: Сборка (cargo, aarch64-apple-ios)
        run: >
          cargo build --release
          --target aarch64-apple-ios
          -p burmalda57-ios
          --bin burmalda57-ios
          --features ios-app

      - name: Упаковка в .ipa
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/ios/rust/Cargo.toml | head -n1)
          IPA="burmalda57-${VERSION}-unsigned.ipa"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          APP="build/Payload/burmalda57.app"
          rm -rf build && mkdir -p "$APP"
          cp target/aarch64-apple-ios/release/burmalda57-ios "$APP/burmalda57"
          chmod +x "$APP/burmalda57"
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@BUILD@/${{ github.run_number }}/" \
              apps/ios/rust/ios/Info.plist > "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          cp apps/ios/rust/ios/icons/*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"
          (cd build && zip -qry "$IPA" Payload)
          echo "--- Mach-O ---"
          lipo -info "$APP/burmalda57"
          vtool -show-build "$APP/burmalda57" | head -8 || true
          ls -lh "build/$IPA"

      - name: Артефакт (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: burmalda57-unsigned-ipa
          path: |
            build/${{ env.IPA }}
            Cargo.lock
          if-no-files-found: error

  # ───────────────────────── Публикация в Releases ─────────────────────────
  release:
    name: GitHub Release
    # только main: обновляем релиз ios-latest
    if: github.ref == 'refs/heads/main'
    needs: [smoke, ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write # публикация релиза и загрузка .ipa
    steps:
      - name: Скачать .ipa
        uses: actions/download-artifact@v4
        with:
          name: burmalda57-unsigned-ipa
          path: dist

      - name: Что скачалось
        run: find dist -type f -exec ls -lh {} +

      # Тег ios-latest создан заранее: GITHUB_TOKEN не может создавать
      # и двигать теги на коммитах с изменениями workflow.
      - name: Подготовить IPA для ios-latest
        id: meta
        run: |
          set -euo pipefail
          IPA=$(find dist/build -name '*.ipa' -type f | head -n1)
          VERSION=$(basename "$IPA" | sed -n 's/^burmalda57-\(.*\)-unsigned\.ipa$/\1/p')
          cp "$IPA" dist/burmalda57-ios-latest-unsigned.ipa
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: GitHub Release (ios-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          target_commitish: ${{ github.sha }}
          # Версию из названия читает проверка обновлений в приложении
          # (crates/core/src/update.rs): не убирайте её отсюда.
          name: iOS latest build ${{ steps.meta.outputs.version }} (unsigned)
          prerelease: false
          make_latest: false
          files: dist/burmalda57-ios-latest-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            Автоматическая сборка iOS из main после успешных smoke-теста и сборки IPA.

            - Версия: ${{ steps.meta.outputs.version }}
            - Коммит: ${{ github.sha }}
            - Запуск: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Пакет не подписан: перед установкой его нужно переподписать (AltStore / Sideloadly / TrollStore).