[package]
name = "burmalda57-android"
version = "1.8.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "burmalda57"
# cdylib — .so для Android
crate-type = ["cdylib"]

[dependencies]
sentry = { version = "0.48.4", default-features = false, features = [
    "backtrace", "contexts", "panic", "ureq", "rustls"
] }

# Android / JNI / логи
android_logger = "0.13"
log = "0.4"
jni = "0.21"
ndk-context = "0.1"

# Общий слой Android/iOS (состояние, UI-логика, сеть)
burmalda57-mobile = { path = "../../../crates/mobile" }

# UI
burmalda57-ui = { path = "../../../crates/ui" }
slint = { version = "=1.18.1", default-features = false, features = [
    "compat-1-2",
    "renderer-femtovg",
    "backend-android-activity-06",
] }
