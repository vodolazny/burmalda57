plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

abstract class CargoNdkBuild extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getJniLibsDirectory()
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'ru.burmalda.journal'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.burmalda.journal'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '1.8.3'
        manifestPlaceholders = [appLabel: 'Бурмалда57']
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Старые локальные сборки могли оставить .so в src/main/jniLibs.
    sourceSets.main.jniLibs.setSrcDirs([])

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'Бурмалда57 Debug']
        }
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        rustore {
            initWith release
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}

// ====================================================================
//  Сборка Rust .so через cargo-ndk перед упаковкой APK
// ====================================================================
def rustDir = file("${rootDir}/rust")
def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: '/opt/android-sdk'
def ndkDir = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT') ?: "${sdkDir}/ndk/29.0.14206865"
def buildToolsVer = '34.0.0'

androidComponents {
    onVariants(selector().all()) { variant ->
        def rustore = variant.buildType == 'rustore'
        def cargoBuild = tasks.register("cargoNdk${variant.name.capitalize()}", CargoNdkBuild) {
            workingDir rustDir
            // Cargo сам отслеживает исходники, фичи и переменные окружения.
            outputs.upToDateWhen { false }

            environment 'ANDROID_HOME',                sdkDir
            environment 'ANDROID_NDK_HOME',            ndkDir
            environment 'ANDROID_NDK_ROOT',            ndkDir
            environment 'ANDROID_JAR',                 "${sdkDir}/platforms/android-34/android.jar"
            environment 'ANDROID_BUILD_TOOLS_VERSION', buildToolsVer
            environment 'ANDROID_D8_JAR',              "${sdkDir}/build-tools/${buildToolsVer}/lib/d8.jar"
            environment 'JAVA_HOME',                   System.getenv('JAVA_HOME') ?: '/usr/lib/jvm/java-17-openjdk'

            if (rustore) {
                // cargo-ndk копирует .so из target после сборки.
                environment 'CARGO_TARGET_DIR', rootProject.file('../../target/rustore').absolutePath
            }

            doFirst {
                commandLine 'cargo', 'ndk', '-t', 'arm64-v8a',
                    '-o', jniLibsDirectory.get().asFile.absolutePath,
                    'build', '--locked', '--release', '-p', 'burmalda57-android'
                if (rustore) {
                    args '--no-default-features', '--features', 'rustore'
                }
            }
        }
        variant.sources.jniLibs.addGeneratedSourceDirectory(cargoBuild) { it.jniLibsDirectory }
    }
}
