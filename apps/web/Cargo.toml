[package]
name = "burmalda57-web"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "burmalda57"
# cdylib — .wasm для браузера
crate-type = ["cdylib", "rlib"]

[features]
# Публичная демонстрация (GitHub Pages): сразу демо, вход и выход отключены.
demo-only = []

[dependencies]
burmalda57-core = { path = "../../crates/core" }
log = "0.4"

# base64 — обёртка DEK и записи localStorage; шифрование даёт core.
base64 = "0.21"
getrandom = { version = "0.2", features = ["js"] }

# UI
slint = { version = "=1.18.1", default-features = false, features = [
    "compat-1-2",
    "renderer-femtovg",
    "backend-winit",
    "std",
] }

# Браузерная платформа
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "MediaQueryList",
    "Location",
    "UrlSearchParams",
    "Storage",
    "console",
    "Crypto",
    "CryptoKey",
    "DomException",
    "SubtleCrypto",
    "Headers",
    "RequestInit",
    "Response",
    "AbortController",
    "AbortSignal",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
]

[build-dependencies]
slint-build = "=1.18.1"
