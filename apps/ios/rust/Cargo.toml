[package]
name = "burmalda57-ios"
version = "1.0.3"
edition = "2021"
license = "Apache-2.0"

[lib]
# cdylib — .so для Android; rlib — чтобы iOS-бинарник мог слинковаться с библиотекой
name = "burmalda57"
crate-type = ["cdylib", "rlib"]

# iOS-приложение — обычный бинарник (так Slint и рекомендует собирать под iOS).
# required-features нужен, чтобы `cargo ndk build` (Android) его не пытался собирать.
# Сборка: cargo build --release --target aarch64-apple-ios --bin burmalda57-ios --features ios-app
[[bin]]
name = "burmalda57-ios"
path = "src/main.rs"
required-features = ["ios-app"]

[features]
ios-app = []

[dependencies]
sentry = { version = "0.48.4", default-features = false, features = [
    "backtrace", "contexts", "panic", "ureq", "rustls"
] }

# Конверт DEK в Keychain (AES-GCM) на стороне iOS-оболочки
aes-gcm = "0.10"
rand = "0.8"

log = "0.4"

# Общий с Android слой (состояние, UI-логика, сеть)
burmalda57-mobile = { path = "../../../crates/mobile" }

# Общий с Android Slint-UI (backend/renderer выбирает эта оболочка ниже)
burmalda57-ui = { path = "../../../crates/ui" }

# ---------- iOS: Slint на winit + Skia (Metal). FemtoVG/glutin на iOS не работают ----------
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
] }

[build-dependencies]
# компилирует ios/glue.m (Objective-C) при сборке под iOS
cc = "1"
